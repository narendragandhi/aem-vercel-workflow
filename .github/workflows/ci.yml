name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui.frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui.frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ui.frontend

      - name: Run TypeScript type check
        run: npm run type-check
        working-directory: ui.frontend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui.frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui.frontend

      - name: Run unit tests
        run: npm test -- --coverage
        working-directory: ui.frontend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ui.frontend/coverage/
          retention-days: 7

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build core module
        run: mvn -B -ntp -pl core -am test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, backend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui.frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui.frontend

      - name: Build project
        run: npm run build
        working-directory: ui.frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ui.frontend/dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui.frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui.frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ui.frontend

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ui.frontend/dist/

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ui.frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui.frontend/tests/e2e/playwright-report/
          retention-days: 7
